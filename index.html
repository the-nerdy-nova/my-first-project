<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerdy Nova</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --white: #ffffff;
      --muted: #b3a6cc;
      --lilac: #c9a6ff;
      --violet: #9d4dff;
      --pixel: "Pixelify Sans", ui-monospace, Menlo, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #06000f, #000000 50%, #0a0218);
      color: var(--white);
      font-family: var(--pixel);
      overflow-x: hidden;
      cursor: crosshair;
    }

    /* Layer 1: big soft blobs of purple light, drifting slowly */
    .glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.28;
      animation: wander 22s ease-in-out infinite alternate;
    }

    .blob:nth-child(1) { background: #7d00ff; top: -20%; left: -15%; }
    .blob:nth-child(2) { background: #3a1aff; bottom: -25%; right: -15%; animation-duration: 27s; animation-delay: -8s; }
    .blob:nth-child(3) { background: #b44dff; top: 30%; left: 35%; width: 40vmax; height: 40vmax; animation-duration: 18s; animation-delay: -4s; }

    @keyframes wander {
      from { translate: -8vw -6vh; scale: 1; }
      to   { translate: 10vw 8vh; scale: 1.25; }
    }

    /* Layer 2: the star field, drawn by the script at the bottom */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Layer 3: the words */
    main {
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 72px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main > *, .about > * {
      animation: rise 0.9s ease-out both;
    }

    h1       { animation-delay: 0.25s; }
    .about   { animation-delay: 0.65s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      padding: 0 0.1em 0.2em;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 8.5rem);
      line-height: 1.15;
      background: linear-gradient(100deg, var(--white), var(--lilac), var(--violet), var(--white));
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 0.9s ease-out 0.25s both, shimmer 7s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 0% 0; }
      to   { background-position: 250% 0; }
    }

    .about { margin-top: 40px; }

    h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--lilac);
    }

    h2::before { content: "// "; opacity: 0.6; }

    .reads {
      margin: 18px 0 0;
      font-size: 1.25rem;
      color: var(--muted);
    }

    .typed {
      display: block;
      min-height: 1.2em;
      margin-top: 4px;
      font-family: var(--pixel);
      font-weight: 600;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.2;
      color: var(--violet);
    }

    .typed::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 0.8em;
      margin-left: 6px;
      background: var(--white);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .tags {
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
      font-size: 1.1rem;
      color: var(--white);
    }

    .tags li + li::before {
      content: "✦";
      margin-right: 14px;
      color: var(--lilac);
    }

    /* Tiny read-outs in the corners */
    .hud {
      position: fixed;
      bottom: 18px;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      opacity: 0.8;
      pointer-events: none;
    }

    .hud.left  { left: 20px; }
    .hud.right { right: 20px; animation: pulse 2.4s ease-in-out infinite; }

    @keyframes pulse { 50% { opacity: 0.3; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <canvas aria-hidden="true"></canvas>

  <main>
    <h1>Nerdy Nova</h1>

    <section class="about">
      <h2>about me</h2>
      <p class="reads">
        I love reading about
        <span class="typed" aria-hidden="true"></span>
      </p>
      <ul class="tags">
        <li>astronomy</li>
        <li>science</li>
        <li>crypto</li>
        <li>finance</li>
        <li>geopolitics</li>
      </ul>
    </section>
  </main>

  <div class="hud left" aria-hidden="true">x 0000 · y 0000</div>
  <div class="hud right" aria-hidden="true">click anywhere ✦</div>

  <script>
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Typewriter ---------- */
    const typed = document.querySelector('.typed');
    const words = ['astronomy', 'science', 'crypto', 'finance', 'geopolitics'];
    let wordIndex = 0;
    let letters = 0;
    let deleting = false;

    function type() {
      const word = words[wordIndex];
      letters += deleting ? -1 : 1;
      typed.textContent = word.slice(0, letters);

      let delay = deleting ? 50 : 110;
      if (!deleting && letters === word.length) {
        deleting = true;
        delay = 1500;
      } else if (deleting && letters === 0) {
        deleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        delay = 350;
      }
      setTimeout(type, delay);
    }

    if (calm) typed.textContent = 'geopolitics';
    else type();

    /* ---------- Star field ---------- */
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let sparks = [];
    let rings = [];
    let comets = [];
    let pointer = null;

    // Real stars are not all white: hot ones are blue-white, cooler ones yellow or orange
    const starColors = ['255, 255, 255', '255, 255, 255', '202, 220, 255', '170, 196, 255', '255, 244, 214', '255, 214, 170'];

    function resize() {
      const sharpness = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * sharpness;
      canvas.height = height * sharpness;
      ctx.setTransform(sharpness, 0, 0, sharpness, 0, 0);

      const count = Math.min(450, Math.round(width * height / 3500));
      stars = Array.from({ length: count }, () => {
        // Most stars are faint and only a few are bright, like the real night sky
        const magnitude = Math.random() ** 5;
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          size: 0.4 + magnitude * 2,
          brightness: 0.45 + magnitude * 0.55,
          color: starColors[Math.floor(Math.random() * starColors.length)],
          vx: (Math.random() - 0.5) * 0.04,
          vy: (Math.random() - 0.5) * 0.04,
          phase: Math.random() * 6.28,
          speed: 1 + Math.random() * 3,
          jitter: Math.random(),
        };
      });
      if (calm) draw(0);
    }

    function drawStar(star, t) {
      // Flicker: two overlapping pulses plus a little random shake, so it never looks regular
      const flicker = 0.7
        + 0.2 * Math.sin(t * star.speed + star.phase)
        + 0.1 * Math.sin(t * star.speed * 4.3 + star.phase * 3)
        + (calm ? 0 : (Math.random() - 0.5) * 0.3 * star.jitter);
      const light = Math.min(1, Math.max(0.12, flicker)) * star.brightness;

      // Brighter stars get a soft coloured halo
      if (star.size > 1.1) {
        const reach = star.size * 6;
        const halo = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, reach);
        halo.addColorStop(0, `rgba(${star.color}, ${light * 0.55})`);
        halo.addColorStop(1, `rgba(${star.color}, 0)`);
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(star.x, star.y, reach, 0, 6.28);
        ctx.fill();
      }

      // The very brightest get thin cross-shaped rays that pulse with the flicker
      if (star.size > 1.9) {
        const ray = star.size * 9 * light;
        ctx.strokeStyle = `rgba(${star.color}, ${light * 0.45})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(star.x - ray, star.y);
        ctx.lineTo(star.x + ray, star.y);
        ctx.moveTo(star.x, star.y - ray);
        ctx.lineTo(star.x, star.y + ray);
        ctx.stroke();
      }

      // The star itself: a sharp point of light
      ctx.fillStyle = `rgba(${star.size > 1.1 ? '255, 255, 255' : star.color}, ${light})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, 6.28);
      ctx.fill();
    }

    function draw(time) {
      const t = time / 1000;
      ctx.clearRect(0, 0, width, height);

      for (const star of stars) {
        star.x = (star.x + star.vx + width) % width;
        star.y = (star.y + star.vy + height) % height;
        drawStar(star, t);

        // Join nearby stars to the cursor, like drawing a constellation
        if (pointer) {
          const distance = Math.hypot(star.x - pointer.x, star.y - pointer.y);
          if (distance < 160) {
            ctx.strokeStyle = `rgba(201, 166, 255, ${(1 - distance / 160) * 0.6})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pointer.x, pointer.y);
            ctx.lineTo(star.x, star.y);
            ctx.stroke();
          }
        }
      }

      // Now and then, a shooting star
      if (Math.random() < 0.004) {
        comets.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.5,
          vx: 7 + Math.random() * 4,
          vy: 2 + Math.random() * 2,
          life: 1,
        });
      }
      for (const comet of comets) {
        comet.x += comet.vx;
        comet.y += comet.vy;
        comet.life -= 0.015;
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(comet.life, 0)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(comet.x - comet.vx * 9, comet.y - comet.vy * 9);
        ctx.stroke();
      }
      comets = comets.filter((comet) => comet.life > 0);

      // Rings and sparks from clicks
      for (const ring of rings) {
        ring.radius += 6;
        ring.life -= 0.02;
        ctx.strokeStyle = `rgba(157, 77, 255, ${Math.max(ring.life, 0)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.radius, 0, 6.28);
        ctx.stroke();
      }
      rings = rings.filter((ring) => ring.life > 0);

      for (const spark of sparks) {
        spark.x += spark.vx;
        spark.y += spark.vy;
        spark.vx *= 0.96;
        spark.vy *= 0.96;
        spark.life -= 0.02;
        ctx.fillStyle = `rgba(${spark.color}, ${Math.max(spark.life, 0)})`;
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, 2, 0, 6.28);
        ctx.fill();
      }
      sparks = sparks.filter((spark) => spark.life > 0);

      if (!calm) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    if (!calm) requestAnimationFrame(draw);

    /* ---------- Reacting to the mouse ---------- */
    const readout = document.querySelector('.hud.left');
    const pad = (number) => String(Math.round(number)).padStart(4, '0');

    window.addEventListener('pointermove', (event) => {
      pointer = { x: event.clientX, y: event.clientY };
      readout.textContent = `x ${pad(event.clientX)} · y ${pad(event.clientY)}`;
    });

    document.addEventListener('pointerleave', () => pointer = null);

    document.addEventListener('pointerdown', (event) => {
      const x = event.clientX;
      const y = event.clientY;

      // A ring and a burst of sparks from where you clicked
      rings.push({ x, y, radius: 0, life: 1 });
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * 6.28;
        const power = 2 + Math.random() * 5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * power,
          vy: Math.sin(angle) * power,
          life: 1,
          color: i % 2 ? '157, 77, 255' : '201, 166, 255',
        });
      }
    });
  </script>
</body>
</html>
