<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritu Bhatiya</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f4ecd2;
      --muted: #b9b08f;
      --sage: #c9d48a;
      --amber: #e2a85c;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #1b1f0e, #14170c 50%, #2b1e12);
      color: var(--cream);
      font-family: var(--mono);
      overflow-x: hidden;
      cursor: crosshair;
    }

    /* Layer 1: big soft blobs of olive and brown light, drifting slowly */
    .glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: wander 22s ease-in-out infinite alternate;
    }

    .blob:nth-child(1) { background: #6b7a3a; top: -20%; left: -15%; }
    .blob:nth-child(2) { background: #7a4a22; bottom: -25%; right: -15%; animation-duration: 27s; animation-delay: -8s; }
    .blob:nth-child(3) { background: #3f5a2a; top: 30%; left: 35%; width: 40vmax; height: 40vmax; animation-duration: 18s; animation-delay: -4s; }

    @keyframes wander {
      from { translate: -8vw -6vh; scale: 1; }
      to   { translate: 10vw 8vh; scale: 1.25; }
    }

    /* Layer 2: the star field, drawn by the script at the bottom */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Layer 3: the stickers */
    .stickers {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      transition: translate 0.4s ease-out;
    }

    .sticker {
      position: absolute;
      font-size: 3.2rem;
      font-weight: 700;
      color: #f7931a;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5));
      animation: float 6s ease-in-out infinite alternate;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.4);
    }

    .sticker:nth-child(2n) { animation-duration: 4.5s; }
    .sticker:nth-child(3n) { animation-delay: -2s; }

    @keyframes float {
      from { translate: 0 -12px; }
      to   { translate: 0 12px; }
    }

    /* Layer 4: the words */
    main {
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 72px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main > *, .about > * {
      animation: rise 0.9s ease-out both;
    }

    .eyebrow { animation-delay: 0.1s; }
    h1       { animation-delay: 0.25s; }
    .role    { animation-delay: 0.45s; }
    .about   { animation-delay: 0.65s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      margin: 0;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: var(--sage);
    }

    h1 {
      margin: 12px 0 0;
      padding: 0 0.1em 0.2em;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.4rem, 13vw, 9.5rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(100deg, var(--cream), var(--sage), var(--amber), var(--cream));
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 0.9s ease-out 0.25s both, shimmer 7s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 0% 0; }
      to   { background-position: 250% 0; }
    }

    .role {
      margin: 0;
      font-size: clamp(0.85rem, 2.4vw, 1.05rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .role span { color: var(--amber); }

    .about { margin-top: 72px; }

    h2 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--sage);
    }

    h2::before { content: "// "; opacity: 0.6; }

    .reads {
      margin: 18px 0 0;
      font-size: 1rem;
      color: var(--muted);
    }

    .typed {
      display: block;
      min-height: 1.2em;
      margin-top: 4px;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.2;
      color: var(--amber);
    }

    .typed::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 0.8em;
      margin-left: 6px;
      background: var(--cream);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .tags {
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
      font-size: 0.85rem;
      color: var(--cream);
    }

    .tags li + li::before {
      content: "✦";
      margin-right: 14px;
      color: var(--sage);
    }

    /* Tiny read-outs in the corners */
    .hud {
      position: fixed;
      bottom: 18px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      opacity: 0.8;
      pointer-events: none;
    }

    .hud.left  { left: 20px; }
    .hud.right { right: 20px; animation: pulse 2.4s ease-in-out infinite; }

    @keyframes pulse { 50% { opacity: 0.3; } }

    @media (max-width: 700px) {
      .sticker { font-size: 2.1rem; opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <canvas aria-hidden="true"></canvas>

  <div class="stickers" aria-hidden="true">
    <span class="sticker" style="top: 6%; left: 5%; rotate: -12deg;">🪐</span>
    <span class="sticker" style="top: 25%; left: 16%; rotate: 10deg;">⭐</span>
    <span class="sticker" style="top: 45%; left: 4%; rotate: -8deg;">🚀</span>
    <span class="sticker" style="top: 65%; left: 15%; rotate: 14deg;">🧪</span>
    <span class="sticker" style="top: 83%; left: 6%; rotate: -10deg;">🪙</span>

    <span class="sticker" style="top: 3%; left: 38%; rotate: 8deg;">☄️</span>
    <span class="sticker" style="bottom: 8%; left: 34%; rotate: -6deg;">₿</span>
    <span class="sticker" style="bottom: 9%; left: 58%; rotate: 12deg;">🔬</span>

    <span class="sticker" style="top: 8%; right: 6%; rotate: 12deg;">🔭</span>
    <span class="sticker" style="top: 27%; right: 17%; rotate: -10deg;">💎</span>
    <span class="sticker" style="top: 47%; right: 5%; rotate: 9deg;">🌙</span>
    <span class="sticker" style="top: 67%; right: 16%; rotate: -14deg;">🧬</span>
    <span class="sticker" style="top: 84%; right: 7%; rotate: 7deg;">⚛️</span>
  </div>

  <main>
    <p class="eyebrow">&lt;hello, world /&gt;</p>
    <h1>Ritu Bhatiya</h1>
    <p class="role">Fraud Investigations <span>@</span> MoonPay</p>

    <section class="about">
      <h2>about me</h2>
      <p class="reads">
        I love reading about
        <span class="typed" aria-hidden="true"></span>
      </p>
      <ul class="tags">
        <li>astronomy</li>
        <li>science</li>
        <li>crypto</li>
        <li>finance</li>
        <li>geopolitics</li>
      </ul>
    </section>
  </main>

  <div class="hud left" aria-hidden="true">x 0000 · y 0000</div>
  <div class="hud right" aria-hidden="true">click anywhere ✦</div>

  <script>
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Typewriter ---------- */
    const typed = document.querySelector('.typed');
    const words = ['astronomy', 'science', 'crypto', 'finance', 'geopolitics'];
    let wordIndex = 0;
    let letters = 0;
    let deleting = false;

    function type() {
      const word = words[wordIndex];
      letters += deleting ? -1 : 1;
      typed.textContent = word.slice(0, letters);

      let delay = deleting ? 50 : 110;
      if (!deleting && letters === word.length) {
        deleting = true;
        delay = 1500;
      } else if (deleting && letters === 0) {
        deleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        delay = 350;
      }
      setTimeout(type, delay);
    }

    if (calm) typed.textContent = 'geopolitics';
    else type();

    /* ---------- Star field ---------- */
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let sparks = [];
    let rings = [];
    let comets = [];
    let pointer = null;

    function resize() {
      const sharpness = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * sharpness;
      canvas.height = height * sharpness;
      ctx.setTransform(sharpness, 0, 0, sharpness, 0, 0);

      const count = Math.min(220, Math.round(width * height / 7000));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.4 + 0.3,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        phase: Math.random() * 6.28,
        speed: Math.random() * 1.5 + 0.5,
      }));
      if (calm) draw(0);
    }

    function draw(time) {
      const t = time / 1000;
      ctx.clearRect(0, 0, width, height);

      // Twinkling, slowly drifting stars
      for (const star of stars) {
        star.x = (star.x + star.vx + width) % width;
        star.y = (star.y + star.vy + height) % height;
        const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(t * star.speed + star.phase));
        ctx.fillStyle = `rgba(244, 236, 210, ${twinkle})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, 6.28);
        ctx.fill();

        // Join nearby stars to the cursor, like drawing a constellation
        if (pointer) {
          const distance = Math.hypot(star.x - pointer.x, star.y - pointer.y);
          if (distance < 160) {
            ctx.strokeStyle = `rgba(201, 212, 138, ${(1 - distance / 160) * 0.6})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pointer.x, pointer.y);
            ctx.lineTo(star.x, star.y);
            ctx.stroke();
          }
        }
      }

      // Now and then, a shooting star
      if (Math.random() < 0.004) {
        comets.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.5,
          vx: 7 + Math.random() * 4,
          vy: 2 + Math.random() * 2,
          life: 1,
        });
      }
      for (const comet of comets) {
        comet.x += comet.vx;
        comet.y += comet.vy;
        comet.life -= 0.015;
        ctx.strokeStyle = `rgba(244, 236, 210, ${Math.max(comet.life, 0)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(comet.x - comet.vx * 9, comet.y - comet.vy * 9);
        ctx.stroke();
      }
      comets = comets.filter((comet) => comet.life > 0);

      // Rings and sparks from clicks
      for (const ring of rings) {
        ring.radius += 6;
        ring.life -= 0.02;
        ctx.strokeStyle = `rgba(226, 168, 92, ${Math.max(ring.life, 0)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.radius, 0, 6.28);
        ctx.stroke();
      }
      rings = rings.filter((ring) => ring.life > 0);

      for (const spark of sparks) {
        spark.x += spark.vx;
        spark.y += spark.vy;
        spark.vx *= 0.96;
        spark.vy *= 0.96;
        spark.life -= 0.02;
        ctx.fillStyle = `rgba(${spark.color}, ${Math.max(spark.life, 0)})`;
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, 2, 0, 6.28);
        ctx.fill();
      }
      sparks = sparks.filter((spark) => spark.life > 0);

      if (!calm) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    if (!calm) requestAnimationFrame(draw);

    /* ---------- Reacting to the mouse ---------- */
    const layer = document.querySelector('.stickers');
    const stickers = document.querySelectorAll('.sticker');
    const readout = document.querySelector('.hud.left');
    const pad = (number) => String(Math.round(number)).padStart(4, '0');

    window.addEventListener('pointermove', (event) => {
      pointer = { x: event.clientX, y: event.clientY };
      readout.textContent = `x ${pad(event.clientX)} · y ${pad(event.clientY)}`;
      // Stickers lean slightly away from the cursor, which gives a sense of depth
      layer.style.translate = `${(0.5 - event.clientX / width) * 30}px ${(0.5 - event.clientY / height) * 30}px`;
    });

    document.addEventListener('pointerleave', () => pointer = null);

    document.addEventListener('pointerdown', (event) => {
      const x = event.clientX;
      const y = event.clientY;

      // A ring and a burst of sparks from where you clicked
      rings.push({ x, y, radius: 0, life: 1 });
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * 6.28;
        const power = 2 + Math.random() * 5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * power,
          vy: Math.sin(angle) * power,
          life: 1,
          color: i % 2 ? '226, 168, 92' : '201, 212, 138',
        });
      }

      // Push every sticker away from the click, then let it spring back
      stickers.forEach((sticker) => {
        const box = sticker.getBoundingClientRect();
        const dx = box.left + box.width / 2 - x;
        const dy = box.top + box.height / 2 - y;
        const distance = Math.hypot(dx, dy) || 1;
        const push = 40 + Math.max(0, 300 - distance) * 0.4;
        sticker.style.transform = `translate(${dx / distance * push}px, ${dy / distance * push}px)`;
      });
      setTimeout(() => stickers.forEach((sticker) => sticker.style.transform = ''), 350);
    });
  </script>
</body>
</html>
